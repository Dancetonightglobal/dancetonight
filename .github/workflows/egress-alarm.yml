name: egress-alarm

# Database egress alarm (D-153). On 10-17 a crawler walking filter URLs pulled ~330 GB a day from
# Supabase through Hyperdrive; the free plan allows 5.5 GB a month. Each morning this reads
# yesterday's Hyperdrive result bytes from Cloudflare's analytics and, over the threshold, opens an
# issue (GitHub emails the owner) and fails. It reads analytics only and touches no database.

on:
  schedule:
    # 8:13am New York time, off the hour (D-051).
    - cron: "13 8 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A repository variable of the same name overrides it without a code change.
      THRESHOLD_MB: ${{ vars.EGRESS_ALARM_MB || '150' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Yesterday's database egress
        run: |
          day=$(date -u -d yesterday +%Y-%m-%d)
          query=$(jq -nc --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg d "$day" '{query: "query($a: String!, $d: Date!) { viewer { accounts(filter: {accountTag: $a}) { hyperdriveQueriesAdaptiveGroups(limit: 100, filter: {date: $d}) { count sum { resultBytes } } } } }", variables: {a: $a, d: $d}}')
          resp=$(curl -fsS https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$query")
          if [ "$(echo "$resp" | jq '.errors | length')" != "0" ]; then
            echo "::error::Cloudflare analytics query failed: $(echo "$resp" | jq -c .errors)"; exit 1
          fi
          mb=$(echo "$resp" | jq '[.data.viewer.accounts[0].hyperdriveQueriesAdaptiveGroups[].sum.resultBytes] | add // 0 | . / 1048576 | floor')
          queries=$(echo "$resp" | jq '[.data.viewer.accounts[0].hyperdriveQueriesAdaptiveGroups[].count] | add // 0')
          echo "$day (UTC): ${mb} MB from the database in ${queries} queries (alarm above ${THRESHOLD_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "$THRESHOLD_MB" ]; then
            title="Database egress alarm: ${mb} MB on $day"
            if [ -z "$(gh issue list --state open --search "Database egress alarm in:title" --json number -q '.[].number')" ]; then
              gh issue create --title "$title" --body "Hyperdrive returned ${mb} MB (${queries} queries) on $day UTC, above the ${THRESHOLD_MB} MB alarm. The free Supabase plan allows 5.5 GB a month. Likely a crawler: check live traffic with wrangler tail (handoff, diag recipe). Close this issue once handled; the alarm opens a new one if it recurs." --assignee "${{ github.repository_owner }}"
            fi
            exit 1
          fi

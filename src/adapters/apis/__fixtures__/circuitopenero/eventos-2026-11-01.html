[1,"El Festival Nacional de Jineteada y Folclore de Diamante es una de las festividades tradicionales más importantes de Argentina, conocida popularmente como \"La Reina de las Jineteadas\". Se celebra cada año en el mes de enero en la ciudad de Diamante, Entre Ríos, y combina la destreza criolla con la música popular de raíz nativa.El evento se compone de dos grandes pilares que se desarrollan en simultáneo:🐎 La Jineteada (Campo Martín Fierro)Es el atractivo central del festival y se lleva a cabo en un predio especialmente diseñado para esta actividad.Competencia de élite: Reúne a los mejores jinetes del país y de países limítrofes, quienes compiten en categorías como crina limpia y bastos con encimera.Las mejores tropillas: Las agrupaciones de caballos más reconocidas de la región asisten para medir la destreza de los montadores.Ambiente tradicional: El campo se llena de relatores, payadores y campaneadores que narran cada montada con el lenguaje típico del gaucho.🎵 El Folclore (Escenario Carlos Santa María)Una vez que terminan las actividades de campo, la acción se traslada al escenario principal por donde desfilan artistas consagrados y emergentes. Música en vivo: Se presentan grandes figuras del folclore nacional, conjuntos de chamamé, danza folclórica y peñas tradicionales. Desfile folclórico: Es común ver agrupaciones tradicionalistas desfilando con sus mejores vestimentas, caballos y aperos por las calles de la ciudad hacia el predio."])</script><script>self.__next_f.push([1,"1a:T709,"])</script><script>self.__next_f.push([1,"El Festival Nacional de Jineteada y Folclore de Diamante es una de las festividades tradicionales más importantes de Argentina, conocida popularmente como \"La Reina de las Jineteadas\". Se celebra cada año en el mes de enero en la ciudad de Diamante, Entre Ríos, y combina la destreza criolla con la música popular de raíz nativa.El evento se compone de dos grandes pilares que se desarrollan en simultáneo:🐎 La Jineteada (Campo Martín Fierro)Es el atractivo central del festival y se lleva a cabo en un predio especialmente diseñado para esta actividad.Competencia de élite: Reúne a los mejores jinetes del país y de países limítrofes, quienes compiten en categorías como crina limpia y bastos con encimera.Las mejores tropillas: Las agrupaciones de caballos más reconocidas de la región asisten para medir la destreza de los montadores.Ambiente tradicional: El campo se llena de relatores, payadores y campaneadores que narran cada montada con el lenguaje típico del gaucho.🎵 El Folclore (Escenario Carlos Santa María)Una vez que terminan las actividades de campo, la acción se traslada al escenario principal por donde desfilan artistas consagrados y emergentes.Música en vivo: Se presentan grandes figuras del folclore nacional, conjuntos de chamamé, danza folclórica y peñas tradicionales.Desfile folclórico: Es común ver agrupaciones tradicionalistas desfilando con sus mejores vestimentas, caballos y aperos por las calles de la ciudad hacia el predio.⛺ El entorno y la culturaEl festival transforma por completo a la ciudad de Diamante. Dentro y fuera del predio se instala un gran mercado con puestos de artesanías, talabarterías (pilchas gauchas), y una oferta gastronómica centrada en comidas típicas como el asado con cuero, empanadas y pasteles fritos."])</script><script>self.__next_f.push([1,"1b:T602,"])</script><script>self.__next_f.push([1,"La Cooperadora de la Escuela Primer Teniente Morandini en el mes de Mayo de 1965, ante la imperiosa necesidad de recaudar fondos para solventar la atención de los niños celebra una reunión el día 16 de Mayo de ese año. El Sr. Corrales sugiere realizar un festival de trascendencia, varias fueron las opiniones, pero la idea del Sr. Enrique Jarbas Pereyra es la que se acepta por unanimidad: realizar un festival de doma. Se decide invitar a todas las escuelas de Jesús María, en un principio fueron diez instituciones más tarde se adhirieron cooperadoras de Colonia Caroya y Estación Caroya conformándose la “Unión de Cooperadoras Escolares”. Cada cooperadora envió un representante o delegado para elegir la Comisión Directiva del Festival Nacional de Doma, dicho espectáculo sería complementado con el canto y la danza nativa.\n \n\nEl terreno baldío, asentamiento del Festival fue conseguido por gestiones del Sr Reimundo Colombo, se le hizo la erradicación de yuyos y otros trabajos. Se preparó un escenario circular de unos 15 metros de diámetro y 1,50 m de altura a unos cincuenta metros de la actual entrada. La pista de jineteada se cerró con alambre sujetos a postes prestados por la Cooperativa de Servicios Públicos, los corrales y mangas se ubicaron hacia el norte junto a unos viejos perales y los bretes hacia el este. Se buscó una frase para ser puesta al aire por el maestro de ceremonias y se acepto la del señor Saray Goulú : “Desde Jesús María, capital Nacional de la Doma y el Folklore”."])</script><script>self.__next_f.push([1,"1c:T4e4,Cada mes de enero, la ciudad de Corrientes se convierte en el epicentro de la cultura litoraleña con la celebración de la Fiesta Nacional del Chamamé y Fiesta del Mercosur. Este evento rinde homenaje al chamamé, expresión musical y cultural declarada Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO, que representa la esencia y la identidad del pueblo correntino.\n\nA través de sus melodías, su poesía y su danza, el chamamé transmite las tradiciones, sentimientos y valores de la región. Durante varias jornadas, destacados artistas de Corrientes, del litoral argentino y de países vecinos como Paraguay, Brasil y Uruguay comparten escenario en una celebración única que reúne música, cultura y tradición.\n\nLa Fiesta Nacional del Chamamé es una experiencia imperdible para quienes desean conocer y vivir una de las manifestaciones culturales más auténticas y representativas del nordeste argentino.\n\nLas más importantes figuras del chamamé desfilan durante diez noches por el Anfiteatro «Mario del Transito Cocomarola», protagonizando una de las mayores fiestas populares del país, donde se origina el famoso «Sapukái», ese grito que nace de las entrañas y que estalla en la garganta, expresando un sentimiento.1d:T4e4,Cada mes de enero, la ciudad de Corrientes se convierte en el epicentro de la cultura litoraleña con la celebración de la Fiesta Nacional del Chamamé y Fiesta del Mercosur. Este evento rinde homenaje al chamamé, expresión musical y cultural declarada Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO, que representa la esencia y la identidad del pueblo correntino.\n\nA través de sus melodías, su poesía y su danza, el chamamé transmite las tradiciones, sentimientos y valores de la región. Durante varias jornadas, destacados artistas de Corrientes, del litoral argentino y de países vecinos como Paraguay, Brasil y Uruguay comparten escenario en una celebración única que reúne música, cultura y tradición.\n\nLa Fiesta Nacional del Chamamé es una experiencia imperdible para quienes desean conocer y vivir una de las manifestaciones culturales más auténticas y representativas del nordeste argentino.\n\nLas más importantes figuras del chamamé desfilan durante diez noches por el Anfiteatro «Mario del Transito Cocomarola», protagonizando una de las mayores fiestas populares del país, donde se origina el famoso «Sapukái», ese grito que nace de las entrañas y que estalla en la garganta, expresando un sentimiento."])</script><script>self.__next_f.push([1,"b:[\"$\",\"div\",null,{\"children\":[[\"$\",\"div\",null,{\"className\":\"bg-gradient-to-b from-[#2a1a0e] to-[#3d2512] text-white border-b border-[#4a2e18]\",\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 py-14\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[#d4926a] text-xs uppercase tracking-widest font-semibold mb-3\",\"children\":\"Agenda\"}],[\"$\",\"h1\",null,{\"className\":\"text-3xl md:text-4xl font-bold mb-2 text-white\",\"style\":{\"fontFamily\":\"var(--font-pla 8\",null,{\"eventos\":[{\"id\":114,\"titulo\":\"1° FESTIVAL CRIOLLO\",\"descripcion\":\"Llega una fiesta bien nuestra al predio de la Sociedad Rural de Junín: dos jornadas a pura tradición, campo y encuentro popular para disfrutar de punta a punta en familia.\\n• Espectáculos y destrezas: Dos días completos de exhibiciones de caballos y jineteada criolla.\\n• Música y peña en vivo: Lo mejor de nuestro folclore para cantar y bailar todo el fin de semana.\\n• Propuestas familiares: Paseo gastronómico criollo, artesanos y entretenimiento para todas las edades.\\n• Gran cierre de oro: Todo el repertorio y la fuerza festivalera de Chaqueño Palavecino para despedir la fiesta bien arriba.\\nPrepará el mate y las ganas de bailar. En breve anunciaremos los detalles de esta fiesta criolla, no te quedes afuera del festival más esperado de la región.\",\"fecha\":\"2026-10-31\",\"fecha_fin\":\"2026-11-01\",\"hora\":\"09:00\",\"precio\":null,\"imagen_url\":\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/68430ef520014790975e7f2e2e1a7b7e.jpg\",\"direccion\":\"Predio Sociedad Rural de Junin\",\"rubro\":\"ambos\",\"comida\":false,\"telefono_reservas\":null,\"pena\":null,\"festival\":{\"id\":11,\"nombre\":\"FESTIVAL CRIOLLO\",\"organizacion\":\"Sociedad Rural de Junin\",\"descripcion\":\"La Sociedad Rural de Junín anunció la realización del primer Festival Criollo, una propuesta que reunirá durante dos jornadas tradición, caballos criollos, folclore, música, gastronomía y actividades para toda la familia.\\n📅 31 de octubre y 1 de noviembre\\n📍 Sociedad Rural de Junín\\n🎶 Cierre estelar: el Chaqueño Palavecino\\nEl caballo criollo será uno de los grandes protagonistas, con distintas pruebas y disciplinas vinculadas a las tradiciones camperas. La iniciativa surge a partir del crecimiento que tuvieron los Aparte Campero, que en sus últimas ediciones llegaron a convocar a más de 5.000 personas.\\nEl Municipio de Junín acompañará la realización del festival. El intendente Ju \\nSe celebra para homenajear a los productores y cosechadores de manzanas. La festividad se lleva cabo todos los años, en el mes de febrero, en General Roca, Río Negro.\\n\\nFecha: 3, 4, 5 de febrero de 2017. (generalmente segunda fin de semana de Febrero).\\n\\nLugar: Ruta Nacional 22 Y San Juan, General Roca, Rio Negro.\\n\\nPrecio: la entrada al predio es libre y gratuita. Los costos del escenario mayor de artistas nacionales e internacionales dependen de los días en que se asiste. Ver el cuadro de precios más abajo.\",\"fecha\":\"2027-02-03\",\"fecha_fin\":\"2027-02-05\",\"hora\":\"21:00\",\"precio\":null,\"imagen_url\":\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/af39db3625624e829b72e5482d71c5d5.jpg\",\"direccion\":\"Predio Ferial Municipal - Tronador 260\",\"rubro\":\"ambos\",\"comida\":false,\"telefono_reservas\":null,\"pena\":null,\"festival\":{\"id\":6,\"nombre\":\"FIESTA NACIONAL DE LA MANZANA\",\"organizacion\":\"Municipalidad de General Roca\",\"descripcion\":\"La Fiesta Nacional de la Manzana es uno de los eventos anuales más convocantes del Valle de Río Negro.\\n\\nSe celebra para homenajear a los productores y cosechadores de manzanas. La festividad se lleva cabo todos los años, en el mes de febrero, en General Roca, Río Negro.\\n\\nLa Fiesta Nacional de la Manzana se celebra desde el año 1964 y durante los días que dura la festividad se realizan variadas actividades como el concurso de embaladores y el del peso de la manzana. En el marco de la fiesta hay muestras de productores de manzanas y exhibición artesanías de la zona.\\n\\nTambién hay diferentes entretenimientos para toda la familia, propuestas gastronómicas, elección de la Reina de la Manzana y espectáculos musicales con famosos artistas nacionales e internacionales.\\n\\nEn el escenario mayo cada noche hay shows musicales de diferentes ritmos musicales con artistas de renombre. El cierre es con un espectáculo musical y show de fuegos artificiales.\",\"direccion\":\"Predio Ferial Municipal - Tronador 260\",\"ciudad\":\"Valle Rio Negro\",\"provincia\":\"Río Negro\",\"lat\":-38.9631402,\"lng\":-67.8664957,\"foto_url\":\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/7b2f7d6a1a514cb4877130956edd7ac0.png\",\"telefono\":null,\"mostrar_telefono\":true,\"email_contacto\":null,\"mostrar_email\":false,\"instagram\":\"fnmroca\",\"facebook\":\"FiestaNacionaldelaManzana\",\"youtube\":null,\"tiktok\":null,\"sitio_web\":\"generalroca.gob.ar\",\"capacidad\":null,\"fotos\":[\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/7bc7ae926ba84d2b973d22a91c26389c.jpg\",\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/0f5d6b465a3a4313b9278ba04bd23648.jpg\",\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/d0fec39cbf524e52b9de3b5f95841034.jpg\",\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/bc60a68ecd344e73b68d5ee7237e24f2.jpg\"],\"video_urls\":[],\"bloqueado\":false},\"artistas\":[],\"artistas_externos\":[],\"invitaciones_pendientes\":[]},{\"id\":128,\"titulo\":\"CHAYA 2027\",\"descripcion\":\"Fiesta de la Chaya 2027\\nSerá del jueves 4 al lunes 8 de febrero de 2027, en el Autódromo Ciudad de La Rioja: 5 noches de música, albahaca y harina en La Rioja.\",\"fecha\":\"2027-02-04\",\"fecha_fin\":\"2027-02-08\",\"hora\":\"21:00\",\"precio\":null,\"imagen_url\":\"https://pub-bb33062c255d46688431483fd620f75e.r2.dev/uploads/1ffeb8cdbc5e439097b4420804ad98ad.jpg\",\"direccion\":\"Autódromo Ciudad de La Rioja\",\"rubro\":\"ambos\",\"comida\":false,\"telefono_reservas\":null,\"pena\":null,\"festival\":{\"id\":7,\"nombre\":\"FIESTA DE LA CHAYA\",\"organizacion\":\"Comisión Organizadora de la Chaya\",\"descripcion\":\"La Fiesta Nacional de la Chaya es la celebración tradicional más importante de la provincia de La Rioja, Argentina.\\n\\nFiesta Chaya 2026\\n\\nCada febrero, la Fiesta de la Chaya llena La Rioja de música, danza, harina, agua y aroma a albahaca. En toda la provincia se viven los tradicionales ‘t
